name: Compilar instalador Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 · Skalee Cartazes A5 v0.7.1
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      APP_VERSION: '0.7.1'
      ARTIFACT_NAME: Skalee-Cartazes-A5-v0.7.1-Windows-x64
      INSTALLER_NAME: Skalee-Cartazes-A5-0.7.1-windows-x64-setup.exe
      MSI_NAME: Skalee-Cartazes-A5-0.7.1-windows-x64.msi
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Instalar dependências
        run: npm ci
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Testar documentos e editor
        run: npm test
      - name: Compilar frontend e conferir configuração
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:config
      - name: Testar arquivos locais em Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Gerar instalador EXE
        run: npm run tauri -- build --bundles nsis,msi
      - name: Conferir instalador e gerar checksum
        run: |
          $pkgVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content -LiteralPath src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($pkgVersion -ne $env:APP_VERSION -or $tauriVersion -ne $env:APP_VERSION) {
            throw "Divergência de versão: workflow=$($env:APP_VERSION), package.json=$pkgVersion, tauri.conf.json=$tauriVersion"
          }
          $nsisDir = 'src-tauri/target/release/bundle/nsis'
          $msiDir = 'src-tauri/target/release/bundle/msi'
          $allExes = @(Get-ChildItem -LiteralPath $nsisDir -Filter '*.exe' -File -ErrorAction SilentlyContinue)
          $allMsis = @(Get-ChildItem -LiteralPath $msiDir -Filter '*.msi' -File -ErrorAction SilentlyContinue)
          Write-Host "Arquivos .exe gerados em ${nsisDir}: $($allExes.Name -join ', ')"
          Write-Host "Arquivos .msi gerados em ${msiDir}: $($allMsis.Name -join ', ')"
          $pattern = "*_$($env:APP_VERSION)_x64-setup.exe"
          $installers = @($allExes | Where-Object { $_.Name -like $pattern })
          if ($installers.Count -ne 1) {
            throw "Esperado exatamente um instalador NSIS x64 v$($env:APP_VERSION) (padrão $pattern); encontrados: $($installers.Count) [disponíveis: $($allExes.Name -join ', ')]"
          }
          $msiPattern = "*_$($env:APP_VERSION)_x64_*.msi"
          $msiInstallers = @($allMsis | Where-Object { $_.Name -like $msiPattern })
          if ($msiInstallers.Count -ne 1) {
            throw "Esperado exatamente um instalador MSI x64 v$($env:APP_VERSION) (padrão $msiPattern); encontrados: $($msiInstallers.Count) [disponíveis: $($allMsis.Name -join ', ')]"
          }
          $producedName = $installers[0].Name
          Write-Host "Instalador NSIS x64 localizado: $producedName ($($installers[0].Length) bytes)"
          if ($installers[0].Length -eq 0) { throw 'O instalador está vazio.' }
          $producedMsiName = $msiInstallers[0].Name
          Write-Host "Instalador MSI x64 localizado: $producedMsiName ($($msiInstallers[0].Length) bytes)"
          if ($msiInstallers[0].Length -eq 0) { throw 'O instalador MSI está vazio.' }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $destination = Join-Path artifacts $env:INSTALLER_NAME
          $msiDestination = Join-Path artifacts $env:MSI_NAME
          Copy-Item -LiteralPath $installers[0].FullName -Destination $destination
          Copy-Item -LiteralPath $msiInstallers[0].FullName -Destination $msiDestination
          $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          $msiHash = (Get-FileHash -LiteralPath $msiDestination -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:INSTALLER_NAME`n$msiHash  $env:MSI_NAME" | Set-Content -LiteralPath artifacts/SHA256SUMS.txt -Encoding utf8
          @"
          Skalee Cartazes A5 v$($env:APP_VERSION) — Windows x64
          Commit: $env:GITHUB_SHA
          Execução: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          Instalador Tauri NSIS: $producedName
          Instalador Publicado: $env:INSTALLER_NAME
          SHA256: $hash
          Instalador Tauri MSI: $producedMsiName
          Instalador MSI Publicado: $env:MSI_NAME
          SHA256 MSI: $msiHash
          "@ | Set-Content -LiteralPath artifacts/BUILD-INFO.txt -Encoding utf8
      - name: Disponibilizar instalador
        id: installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            artifacts/*.exe
            artifacts/*.msi
            artifacts/SHA256SUMS.txt
            artifacts/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Registrar entrega no resumo
        env:
          ARTIFACT_URL: ${{ steps.installer.outputs.artifact-url }}
        run: |
          @"
          ## Skalee Cartazes A5 v$($env:APP_VERSION) — Windows x64
          - Instalador NSIS: $env:INSTALLER_NAME
          - Instalador MSI: $env:MSI_NAME
          - Commit: $env:GITHUB_SHA
          - [Baixar artefato $env:ARTIFACT_NAME]($env:ARTIFACT_URL)
          - O ZIP inclui SHA256SUMS.txt e BUILD-INFO.txt.
          - Testes TypeScript/React e Rust aprovados; compilação NSIS concluída.
          - Instalação interativa e impressão física não são verificadas por este workflow.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
